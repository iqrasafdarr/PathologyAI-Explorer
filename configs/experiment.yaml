# =============================================================================
# PathologyAI Explorer — Experiment Configuration
# Single source of truth for Phase 1 + Phase 2 training.
# =============================================================================

seed: 42

# ---------------------------------------------------------------------------
# Dataset paths
# ---------------------------------------------------------------------------
data:
  root_dir: "data"
  train_x: "camelyonpatch_level_2_split_train_x.h5"
  train_y: "camelyonpatch_level_2_split_train_y.h5"
  valid_x: "camelyonpatch_level_2_split_valid_x.h5"
  valid_y: "camelyonpatch_level_2_split_valid_y.h5"
  test_x: "camelyonpatch_level_2_split_test_x.h5"
  test_y: "camelyonpatch_level_2_split_test_y.h5"
  image_size: 96

# ---------------------------------------------------------------------------
# DataLoader
# ---------------------------------------------------------------------------
dataloader:
  batch_size: 32
  num_workers: 0
  pin_memory: true

# ---------------------------------------------------------------------------
# Model
# Binary classification uses ONE output logit with BCEWithLogitsLoss.
# ---------------------------------------------------------------------------
model:
  name: "resnet50"
  pretrained: true
  num_classes: 1
  freeze_backbone: false

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  epochs: 10
  learning_rate: 0.0001
  weight_decay: 0.0001
  checkpoint_dir: "results/checkpoints"
  best_metric: "f1"

# ---------------------------------------------------------------------------
# Results
# ---------------------------------------------------------------------------
results:
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"

# ---------------------------------------------------------------------------
# Device
# ---------------------------------------------------------------------------
device:
  prefer: "cuda"
